<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <link rel="manifest" href="manifest.json">

  <title>富士宮市10分団・通知バッジテスト</title>
</head>

<body>

  <h1>富士宮市10分団・通知バッジテスト</h1>

  <p>PWAテスト環境</p>

  <button id="notifyButton">通知テスト</button>

  <button id="badgeButton">バッジテスト</button>

  <button id="liveBadgeButton">実際の未対応件数をバッジ表示</button>

 <div id="result"></div> 

  <script>
window.__receiveBadgeCount = async function(data) {
  const result = document.getElementById("result");

  if (!data || typeof data.count !== "number") {
    result.textContent = "未対応件数を正しく取得できませんでした。";
    return;
  }

  try {
    if ("setAppBadge" in navigator) {
      await navigator.setAppBadge(data.count);
      result.textContent =
        "実際の未対応件数 " + data.count + " 件をバッジに設定しました。";
    } else {
      result.textContent =
        "未対応件数 " + data.count + " 件を取得しましたが、この環境はバッジに対応していません。";
    }
  } catch (error) {
    result.textContent =
      "未対応件数 " + data.count + " 件を取得しましたが、バッジ設定に失敗しました。";
  }
};
</script>

  <script>
document.getElementById("badgeButton").addEventListener("click", async function() {
  if ("setAppBadge" in navigator) {
    await navigator.setAppBadge(5);
    alert("バッジを5に設定しました。");
  } else {
    alert("この環境ではバッジに対応していません。");
  }
});
</script>

  <script>
    document.getElementById("liveBadgeButton")
  .addEventListener("click", function() {

    const result = document.getElementById("result");

    result.textContent = "未対応件数を取得しています……";

    function loadBadgeCount(isRetry) {
      const script = document.createElement("script")loadBadgeCount;

      script.onerror = function() {
        script.remove();

        if (!isRetry) {
          result.textContent =
            "外部スクリプトの読み込みに失敗しました。1回だけ再試行します……";

          loadBadgeCount(true);
        } else {
          result.textContent =
            "診断結果：再試行しても外部スクリプトの読み込みに失敗しました。";
        }
      };

      script.src =
        "https://script.google.com/macros/s/AKfycbwH2Km1P0pQ9NheC2j8KvceeFiHfp4CU9XRlJ1yKa-GTrGf3px-Gxl4k3Q_8BTo0ISD/exec?page=badgecount&_=" +
        Date.now();

      document.body.appendChild(script);
    }

    loadBadgeCount(false);
  });
  </script>
  <script>
    document.getElementById("notifyButton")
      .addEventListener("click", async function() {
        if (!("Notification" in window)) {
          alert("この環境では通知に対応していません。");
          return;
        }

        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
          alert("通知が許可されませんでした。");
          return;
        }

        const registration = await navigator.serviceWorker.ready;

        await registration.showNotification(
          "富士宮市10分団・通知テスト",
          {
            body: "通知テストに成功しました。"
          }
        );
      });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
