<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <link rel="manifest" href="manifest.json">

  <title>富士宮市10分団・通知バッジテスト</title>
</head>

<body>

  <h1>富士宮市10分団・通知バッジテスト</h1>

  <p>PWAテスト環境</p>

  <button id="notifyButton">通知テスト</button>

  <button id="badgeButton">バッジテスト</button>

  <button id="liveBadgeButton">実際の未対応件数をバッジ表示</button>

 <div id="result"></div> 

  <script>
document.getElementById("badgeButton").addEventListener("click", async function() {
  if ("setAppBadge" in navigator) {
    await navigator.setAppBadge(5);
    alert("バッジを5に設定しました。");
  } else {
    alert("この環境ではバッジに対応していません。");
  }
});
</script>

  <script>
    document.getElementById("notifyButton").addEventListener("click", async function() {
      if (!("Notification" in window)) {
        alert("この環境では通知に対応していません。");
        return;
      }

      const permission = await Notification.requestPermission();

      if (permission !== "granted") {
        alert("通知が許可されませんでした。");
        return;
      }

      const registration = await navigator.serviceWorker.ready;

      await registration.showNotification(
        "富士宮市10分団・通知テスト",
        {
          body: "通知テストに成功しました。"
        }
      );
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }

   // --------------------------------------------------
// Apps Scriptから実際の未対応件数を取得して
// PWA自身のホーム画面バッジに表示するテスト
// --------------------------------------------------

window.__receiveBadgeCount = function(data) {

  const count = Number(data.count || 0);

  if ("setAppBadge" in navigator) {

    navigator.setAppBadge(count);

    document.getElementById("result").textContent =
      "実際の未対応" + count + "件をバッジに設定しました。";

  } else {

    document.getElementById("result").textContent =
      "この環境ではホーム画面バッジに対応していません。";

  }

};


// --------------------------------------------------
// Apps Scriptから送られた未対応件数を受け取る
// --------------------------------------------------

window.addEventListener("message", function(event) {

  if (
    event.origin !== "https://script.google.com" &&
    event.origin !== "https://script.googleusercontent.com"
  ) {
    return;
  }

  if (
    !event.data ||
    event.data.type !== "rescueBadgeCount"
  ) {
    return;
  }

  window.__receiveBadgeCount({
    count: event.data.count
  });

});

document.getElementById("liveBadgeButton")
  .addEventListener("click", function() {

    document.getElementById("result").textContent =
      "未対応件数を取得しています……";

    const iframe =
      document.createElement("iframe");

    iframe.style.display = "none";

    iframe.src =
      "https://script.google.com/macros/s/AKfycbzTQp6_ymsC5KSN7OO57OCT2IEAhsSEGrbPvI-4JWpN/exec?page=badgecount&_=" +
      Date.now();

    document.body.appendChild(iframe);

  });
    
  </script>

</body>
</html>
